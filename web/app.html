    <title>哦鲸鲸 · 悬浮窗</title>

    <!-- 字体不打包：运行时加载 + 缓存，离线回落到 Microsoft YaHei UI（§7.2） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/xj/static/src/styles.css" />
    <link rel="stylesheet" href="/xj/embed.css" />

    <!-- 原型自检：任何脚本异常都直接显示出来（评审时能看见，而不是白屏） -->
    <script>
      window.__xjErrors = [];
      window.addEventListener("error", function (e) {
        window.__xjErrors.push(String(e.message));
        var box = document.getElementById("xj-boot-error") || document.createElement("div");
        box.id = "xj-boot-error";
        box.style.cssText =
          "position:fixed;left:12px;top:12px;z-index:999;max-width:70vw;padding:10px 12px;border-radius:10px;" +
          "background:rgba(248,113,113,.16);border:1px solid rgba(248,113,113,.6);color:#ffd9d9;" +
          "font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap";
        box.textContent = "脚本异常：\n" + window.__xjErrors.join("\n");
        document.body && document.body.appendChild(box);
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__xjErrors.push("Promise: " + (e.reason && (e.reason.stack || e.reason.message || e.reason)));
      });
    </script>
  </head>
  <body>

          <div class="traffic"><i></i><i></i><i></i></div>
          <span>DeepSeek Harness · 主窗口</span>
        </div>
        <div class="mock-body">
          <div>

    <div class="taskbar" aria-hidden="true">

      <div class="tb-icon"><!-- files -->▤</div>
      <div class="tb-icon"><!-- term -->&gt;_</div>
      <div class="tb-icon"><!-- clock -->◔</div>
    </div>

    <!-- ============ 悬浮窗舞台：所有形态在这里挂载 ============ -->

    <!-- ============ 反馈层 ============ -->
    <div id="toast-layer" class="toasts" role="region" aria-label="提示"></div>
    <div id="notify-layer"></div>
